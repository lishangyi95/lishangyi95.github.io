<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习导航页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 0;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav-links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .nav-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .nav-item:hover {
            transform: scale(1.05);
        }

        .nav-item h3 {
            font-size: 1.5em;
            color: #333;
        }

        .nav-item p {
            color: #666;
        }

        .nav-item a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .nav-item a:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>学习资源导航</h1>
    <p>选择你感兴趣的课程，开始学习吧！</p>
</header>

<div class="container">
    <div class="nav-links">
        <!-- 计算机网络 -->
        <div class="nav-item">
            <h3>计算机网络</h3>
            <p>学习计算机网络的基础和高级知识</p>
            <a href="https://www.bilibili.com/video/BV1JV411t7ow" target="_blank">立即观看</a>
        </div>

        <!-- 数据结构与算法 -->
        <div class="nav-item">
            <h3>数据结构与算法</h3>
            <p>深入了解数据结构与算法的核心概念</p>
            <a href="https://www.bilibili.com/video/BV1DV411T7ow" target="_blank">立即观看</a>
        </div>

        <!-- Python编程 -->
        <div class="nav-item">
            <h3>Python编程</h3>
            <p>学习Python编程语言，从基础到进阶</p>
            <a href="https://www.bilibili.com/video/BV1i4411D7do" target="_blank">立即观看</a>
        </div>

        <!-- Web开发 -->
        <div class="nav-item">
            <h3>Web开发</h3>
            <p>学习前端和后端的开发技术，构建现代Web应用</p>
            <a href="https://www.bilibili.com/video/BV1rZ4y1f7Tt" target="_blank">立即观看</a>
        </div>

        <!-- 人工智能 -->
        <div class="nav-item">
            <h3>人工智能</h3>
            <p>了解人工智能的基础理论和实际应用</p>
            <a href="https://www.bilibili.com/video/BV1J54y1A7zB" target="_blank">立即观看</a>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2025 学习导航网站 | 版权所有</p>
</footer>

</body>
</html>
